name: invix-catalog
x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: invix-catalog-backend:local
  environment: &environment
    DATABASE_URL: postgresql://catalog:${POSTGRES_PASSWORD:-local-catalog-db}@postgres:5432/catalog
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-minio-user}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-local-minio-password}
    BOT_TOKEN: ${BOT_TOKEN:-}
    ADMIN_IDS: ${ADMIN_IDS:-}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    MINI_APP_URL: ${MINI_APP_URL:-https://example.com}
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-catalog-db}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: ./infra
      dockerfile: Minio.Dockerfile
    image: invix-catalog-minio:local
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-minio-password}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *backend
    command: python -m catalog.migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  bot:
    <<: *backend
    profiles: [telegram]
    command: uvicorn catalog.webhook:app --factory --host 0.0.0.0 --port 8001 --no-access-log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    profiles: [telegram]
    command: python -m catalog.worker
    stop_grace_period: 90s
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend]
    restart: unless-stopped
  tests:
    <<: *backend
    profiles: [test]
    build:
      context: ./backend
      target: test
    image: invix-catalog-tests:local
    environment:
      <<: *environment
      DATABASE_URL: postgresql://catalog:${POSTGRES_PASSWORD:-local-catalog-db}@postgres:5432/catalog_test
      BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      WEBHOOK_SECRET: test-secret-abcdefghijklmnopqrstuvwxyz
      ADMIN_IDS: "42"
    command: python -m pytest -q -p no:cacheprovider
    restart: "no"

volumes:
  postgres-data:
  minio-data:
