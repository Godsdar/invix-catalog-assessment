[project]
name = "invix-catalog"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiogram>=3.20,<4",
  "psycopg[binary,pool]>=3.2,<4", "boto3>=1.35,<2",
  "pillow>=11,<13", "pydantic-settings>=2.8,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
